<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Draw Shapes</title>

    body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0; }

  <div id="dims"></div>
  <canvas id="canvas" width="800" height="600"></canvas>
  <script src="app.js"></script>
</body>
</html>
